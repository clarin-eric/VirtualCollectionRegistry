<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>API Documentation</title>
    <link rel="stylesheet" type="text/css" href="./webjars/swagger-ui/5.31.0/swagger-ui.css">
    <link rel="icon" type="image/png" href="./webjars/swagger-ui/5.31.0/favicon-32x32.png" sizes="32x32">
</head>
<body>
    <div id="swagger-ui"></div>
    <script src="./webjars/swagger-ui/5.31.0/swagger-ui-bundle.js"></script>
    <script src="./webjars/swagger-ui/5.31.0/swagger-ui-standalone-preset.js"></script>
    <script>
        window.onload = function() {
            window.ui = SwaggerUIBundle({
                url: "/service/swagger.json", // Your JSON location
                dom_id: '#swagger-ui',
                deepLinking: true,
                presets: [
                    SwaggerUIBundle.presets.apis,
                    SwaggerUIStandalonePreset
                ],
                layout: "StandaloneLayout"
            });
        };
    </script>
</body>
</html>
